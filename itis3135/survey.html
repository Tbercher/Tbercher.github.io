<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trevor Bercher's Tenacious Bear | ITIS3135 | Survey Project</title>
    <!----Accumulus Script Below-->
    <script
      src="https://lint.page/kit/4d0fe3.js"
      crossorigin="anonymous"
    ></script>
    <link rel="stylesheet" href="/itis3135/styles/survery.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Libre+Baskerville:ital,wght@0,400..700;1,400..700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div data-include="components/header.html"></div>

    <main>
      <h2>Survey Project</h2>
      <p>Thank you for taking the time to help us improve the platform</p>

      <form>
        <fieldset>
          <legend>Contact Information</legend>
          <label id="name-label" for="name">Name</label>
          <input id="name" type="text" placeholder="Enter your name" required />

          <label id="email-label" for="email">Email</label>
          <input
            id="email"
            type="email"
            placeholder="Enter your email"
            required
          />

          <label id="number-label" for="number">Age (optional)</label>
          <input
            id="number"
            type="number"
            min="10"
            max="99"
            placeholder="Age"
          />

          <label for="dropdown"
            >Which option best describes your current role?</label
          >
          <select id="dropdown">
            <option disabled selected value="">Select current role</option>
            <option value="student">Student</option>
            <option value="job">Full Time Job</option>
          </select>
        </fieldset>

        <fieldset>
          <legend>Would you recommend freeCodeCamp to a friend?</legend>
          <label>
            <input
              name="user-recommend"
              value="definitely"
              type="radio"
              checked
            />
            Definitely
          </label>
          <label>
            <input name="user-recommend" value="maybe" type="radio" /> Maybe
          </label>
        </fieldset>

        <fieldset>
          <legend>
            What would you like to see improved? (Check all that apply)
          </legend>
          <label>
            <input type="checkbox" value="frontend" name="prefer" /> Front-end
            Projects
          </label>
          <label>
            <input type="checkbox" value="backend" name="prefer" /> Back-end
            Projects
          </label>
        </fieldset>

        <fieldset>
          <legend>Additional Feedback</legend>

          <label for="comment">Your Feedback:</label>

          <textarea
            id="comment"
            name="comment"
            placeholder="Enter your comment here..."
          ></textarea>
        </fieldset>

        <button id="submit" type="submit">Submit</button>
      </form>
    </main>
    <div data-include="components/footer.html"></div>
    <script src="scripts/HTMLInclude.min.js"></script>
  </body>
</html>
