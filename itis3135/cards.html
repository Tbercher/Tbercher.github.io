<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trevor Bercher's Tenacious Bear | ITIS3135 | Playing Cards</title>
    <script
      src="https://lint.page/kit/4d0fe3.js"
      crossorigin="anonymous"
    ></script>
    <link rel="stylesheet" href="styles/cards.css" />
    <link rel="stylesheet" href="/itis3135/styles/default.css" />

    <link
      href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Libre+Baskerville:ital,wght@0,400..700;1,400..700&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <div data-include="components/header.html"></div>
    <main id="playing-cards">
      <div class="card">
        <div class="left">
          <div>A</div>
          <div>♠</div>
        </div>
        <div class="middle">♠</div>
        <div class="right">
          <div class="flipped">♠</div>
          <div class="flipped">A</div>
        </div>
      </div>

      <div class="card">
        <div class="left">
          <div>2</div>
          <div>♣</div>
        </div>
        <div class="middle">
          <div>♣</div>
          <div class="flipped">♣</div>
        </div>
        <div class="right">
          <div class="flipped">♣</div>
          <div class="flipped">2</div>
        </div>
      </div>

      <div class="card red">
        <div class="left">
          <div>3</div>
          <div>♥</div>
        </div>
        <div class="middle">
          <div>♥</div>
          <div>♥</div>
          <div class="flipped">♥</div>
        </div>
        <div class="right">
          <div class="flipped">♥</div>
          <div class="flipped">3</div>
        </div>
      </div>
    </main>
    <div data-include="components/footer.html"></div>
    <script src="scripts/HTMLInclude.min.js"></script>
  </body>
</html>
