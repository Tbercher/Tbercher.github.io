<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Taylor Elizabeth | Booking</title>
    <script
      src="https://lint.page/kit/4d0fe3.js"
      crossorigin="anonymous"
    ></script>
    <link rel="stylesheet" href="styles/default.css" />
    <link rel="stylesheet" href="styles/booking.css" />

    <!-- EmailJS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  </head>

  <body>
    
      <div data-include="components/header.html"></div>
    

    <main>
      <section>
        <h1>BOOKING INQUIRY</h1>

        <form id="bookingForm" novalidate>
          <!-- Name -->
          <div class="form-group">
            <label for="name">Name</label>
            <input
              id="name"
              name="name"
              type="text"
              placeholder="Your full name"
              required
              autocomplete="name"
            />
            <span class="field-msg" id="nameMsg"></span>
          </div>

          <!-- Email -->
          <div class="form-group">
            <label for="email">Email</label>
            <input
              id="email"
              name="email"
              type="email"
              placeholder="you@example.com"
              required
              autocomplete="email"
            />
            <span class="field-msg" id="emailMsg"></span>
          </div>

          <!-- Phone (optional) -->
          <div class="form-group">
            <label for="phone">
              Phone Number
              <span class="optional-badge">optional</span>
            </label>
            <input
              id="phone"
              name="phone"
              type="tel"
              placeholder="(555) 000-0000"
              autocomplete="tel"
            />
            <span class="field-msg" id="phoneMsg"></span>
          </div>

          <!-- Inquiry Type -->
          <div class="form-group">
            <label for="inquiryType">Inquiry Type</label>
            <select id="inquiryType" name="inquiryType" required>
              <option value="" disabled selected>
                Select an inquiry type…
              </option>
              <option value="Wedding">Photo Shoot</option>
              <option value="Portrait Session">Portrait Session</option>
              <option value="Brand / Commercial">Brand / Commercial</option>
              <option value="Event Coverage">Event Coverage</option>
              <option value="Other">Other</option>
            </select>
            <span class="field-msg" id="inquiryMsg"></span>
          </div>

          <!-- Comments / Extras (optional) -->
          <div class="form-group">
            <label for="comments">
              Comments / Extras
              <span class="optional-badge">optional</span>
            </label>
            <textarea
              id="comments"
              name="comments"
              rows="4"
              placeholder="Tell me about your vision, date, location, or anything else you'd like me to know…"
              style="width: 100%; resize: vertical"
            ></textarea>
          </div>

          <button type="submit" id="submitBtn">SUBMIT INQUIRY</button>

          <div id="formStatus" role="alert" aria-live="polite"></div>
        </form>
      </section>
    </main>

    <footer>
      <div data-include="components/footer.html"></div>
    </footer>

    <script src="scripts/HTMLInclude.min.js"></script>

    <script src="scripts/booking.js"></script>
  </body>
</html>
