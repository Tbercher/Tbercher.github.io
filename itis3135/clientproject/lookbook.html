<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Lookbook | Taylor Elizabeth White</title>
    <link rel="stylesheet" href="default.css" />
  </head>
  <body>
    <header>
      <nav>
        <a href="index.html">Home</a>
        <a href="lookbook.html">Lookbook</a>
        <a href="stats.html">Stats</a>
        <a href="about.html">About</a>
        <a href="dashboard.html">Casting</a>
        <a href="booking.html">Book Now</a>
      </nav>
    </header>
    <section>
      <h2>THE LOOKBOOK</h2>
      <div id="filters">
        <button onclick="filterGallery('all')">All</button>
        <button onclick="filterGallery('editorial')">Editorial</button>
        <button onclick="filterGallery('commercial')">Commercial</button>
      </div>
      <div class="gallery-grid">
        <div class="gallery-item editorial">Editorial Shoot A</div>
        <div class="gallery-item commercial">Lifestyle Shoot B</div>
      </div>
    </section>
    <script>
      function filterGallery(category) {
        const items = document.querySelectorAll(".gallery-item");
        items.forEach((item) => {
          item.style.display =
            category === "all" || item.classList.contains(category)
              ? "flex"
              : "none";
        });
      }
    </script>
  </body>
</html>
