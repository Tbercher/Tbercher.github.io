<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Taylor Elizabeth | Specifications</title>
    <script
      src="https://lint.page/kit/4d0fe3.js"
      crossorigin="anonymous"
    ></script>
    <link rel="stylesheet" href="styles/stats.css" />
    <link rel="icon" type="image/x-icon" href="images/favicon.ico" />
  </head>
  <body>
    <div data-include="components/header.html"></div>

    <main>
      <section>
        <h1>Taylor Elizabeth's</h1>

        <h2>Specifications</h2>
        <br />
        <button id="toggle-btn" onclick="toggleUnits()">
          Switch to Metric / EU
        </button>
        <table class="stats-table">
          <tr>
            <td>Height</td>
            <td id="height">6'0"</td>
          </tr>
          <tr>
            <td>Weight</td>
            <td id="weight">140 lbs</td>
          </tr>
          <tr>
            <td>Chest</td>
            <td id="chest">32 in</td>
          </tr>
          <tr>
            <td>Waist</td>
            <td id="waist">27 in</td>
          </tr>
          <tr>
            <td>Hair</td>
            <td id="hair">Sandy Brown</td>
          </tr>
          <tr>
            <td>Eyes</td>
            <td id="eyes">Brown</td>
          </tr>
          <tr>
            <td>Shoes</td>
            <td id="shoes">US 12</td>
          </tr>
        </table>
        <button onclick="downloadCompCard()">DOWNLOAD COMP CARD</button>
      </section>
    </main>
    <footer>
      <div data-include="components/footer.html"></div>
    </footer>
    <script src="scripts/HTMLInclude.min.js"></script>
    <script src="scripts/stats.js"></script>
  </body>
</html>
